<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<body><title>Relatórios GPBR - VALE</title>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="stylesheet" href="fonts.css">
<style>
/* Layout: ferramenta de campo de uma coluna; barra superior fixa com progresso, cartões por seção, barra de ação inferior. */
:root{
  --bg:#EDF0EF; --surface:#FFFFFF; --sunk:#F4F6F5; --ink:#15202B; --muted:#5A6770; --line:#D3DAD8;
  --accent:#D9640A; --accent-ink:#FFFFFF; --accent-soft:#FBE9DA;
  --ok:#1D8549; --warn:#B87D00; --bad:#BF3328; --na:#6F7B82;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:10px; --bar:#15202B; --bar-2:#24313A;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1417; --surface:#172026; --sunk:#111A1F; --ink:#E6ECEA; --muted:#93A1A8; --line:#2A373E;
  --accent:#F08B32; --accent-ink:#1A0F05; --accent-soft:#3A2614;
  --ok:#3DBA72; --warn:#E3AE2B; --bad:#EE6A5E; --na:#8E9AA1; --bar:#080C0E; --bar-2:#1C262C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1417; --surface:#172026; --sunk:#111A1F; --ink:#E6ECEA; --muted:#93A1A8; --line:#2A373E;
  --accent:#F08B32; --accent-ink:#1A0F05; --accent-soft:#3A2614;
  --ok:#3DBA72; --warn:#E3AE2B; --bad:#EE6A5E; --na:#8E9AA1; --bar:#080C0E; --bar-2:#1C262C; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bar)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);color:#F2F5F4;border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px;min-height:56px}
.top h1{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:.02em;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.top h1 small{display:block;font-family:var(--body);font-weight:500;font-size:12px;letter-spacing:.04em;opacity:.7;text-transform:none}
.icon-btn{background:transparent;border:1px solid rgba(255,255,255,.22);color:inherit;border-radius:8px;min-width:42px;height:40px;display:inline-grid;place-items:center;padding:0 10px;font-weight:600;font-size:14px}
.icon-btn svg{width:20px;height:20px}
.prog{height:4px;background:rgba(255,255,255,.15)}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.jump{background:var(--bar-2);color:#F2F5F4;border:0;border-radius:8px;height:40px;max-width:46%;padding:0 8px;font-size:14px}

main{padding-bottom:120px}

/* home */
.intro{padding-block:22px 6px}
.intro h2{font-family:var(--display);font-size:30px;line-height:1.05;margin:0 0 6px;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.intro p{margin:0;color:var(--muted);max-width:60ch}
.grp-t{font-family:var(--display);font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px;display:flex;align-items:center;gap:10px}
.grp-t::after{content:"";flex:1;height:1px;background:var(--line)}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.tpl{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 12px;min-height:96px;transition:border-color .15s,transform .1s}
.tpl:hover{border-color:var(--accent)}
.tpl:active{transform:scale(.99)}
.tpl b{font-family:var(--display);font-size:21px;font-weight:700;text-transform:uppercase;letter-spacing:.01em}
.tpl span{color:var(--muted);font-size:13.5px}
.tpl .tag{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:4px;background:var(--accent-soft);color:var(--accent)}
.saved{display:flex;flex-direction:column;gap:8px}
.rep{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.rep .t{font-weight:600;min-width:0}
.rep .m{grid-column:1;color:var(--muted);font-size:13px;font-family:var(--mono)}
.rep .acts{grid-row:1/span 2;grid-column:2;display:flex;gap:6px}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:99px;margin-left:6px;vertical-align:2px}
.pill.draft{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.pill.done{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.install{display:flex;gap:12px;align-items:center;margin-top:16px;padding:12px 14px;border-radius:var(--r);background:var(--accent-soft);border:1px solid var(--accent)}
.install div{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.install span{font-size:13.5px;color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:14px;border:1px dashed var(--line);border-radius:var(--r)}

/* botões */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-height:44px;padding:0 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.sm{min-height:36px;padding:0 10px;font-size:14px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn svg{width:18px;height:18px;flex:none}

/* formulário */
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-top:14px;scroll-margin-top:calc(80px + env(safe-area-inset-top,0px))}
.sec>h3{margin:0;padding:12px 14px;font-family:var(--display);font-size:19px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:baseline}
.sec>h3 .n{color:var(--accent);font-variant-numeric:tabular-nums}
.sec>h3 .c{margin-left:auto;font-family:var(--body);font-size:13px;font-weight:600;color:var(--muted);text-transform:none;letter-spacing:0}
.sec-b{padding:14px;display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f>label,.lbl{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.f .req::after,.lbl.req::after{content:" *";color:var(--accent)}
input[type=text],input[type=date],input[type=time],input[type=number],textarea,select.inp{width:100%;min-height:46px;border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:10px 12px;font-size:16px}
textarea{min-height:92px;resize:vertical}
input.mono{font-family:var(--mono)}
input:focus,textarea:focus,select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.miss{border-color:var(--bad)!important}

.intro-line{margin:0;color:var(--muted);font-size:14px}
.items{display:flex;flex-direction:column}
.item{padding:12px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;scroll-margin-top:calc(90px + env(safe-area-inset-top,0px))}
.item:first-child{border-top:0;padding-top:0}
.item-h{display:flex;gap:10px;align-items:flex-start;font-weight:600}
.sn{font-family:var(--mono);font-size:13px;color:var(--muted);min-width:24px;padding-top:2px;font-variant-numeric:tabular-nums}
.item-h .it{flex:1;min-width:0}
.item-h input{font-weight:600}
.seg{display:grid;grid-template-columns:repeat(var(--n,4),1fr);gap:6px}
.seg.wide{grid-template-columns:repeat(2,1fr)}
.seg button{min-height:44px;border:1px solid var(--line);background:var(--sunk);border-radius:8px;font-weight:600;font-size:14.5px;padding:4px 6px;line-height:1.15}
.seg button.on{color:#fff;border-color:transparent}
.seg button.on.ok{background:var(--ok)} .seg button.on.warn{background:var(--warn)} .seg button.on.bad{background:var(--bad)} .seg button.on.na{background:var(--na)}
:root[data-theme="dark"] .seg button.on,:root:not([data-theme="light"]) .seg button.on{color:#fff}
.row-obs{display:grid;grid-template-columns:1fr;gap:8px}
.row-obs.read{grid-template-columns:130px 1fr}
.reading{display:flex;align-items:center;gap:6px}
.reading input{font-family:var(--mono)}
.reading span{font-family:var(--mono);color:var(--muted);font-size:14px;min-width:22px}
.obs.need{border-color:var(--warn)}

.act{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.act:first-child{border-top:0}
.act input[type=checkbox]{width:24px;height:24px;accent-color:var(--accent);flex:none}
.act label{flex:1;min-width:0}
.act .reading{width:130px;flex:none}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--sunk);border-radius:99px;min-height:40px;padding:0 14px;font-size:14px;font-weight:600}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.team-row{display:grid;grid-template-columns:1fr 92px;gap:8px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--sunk)}
.team-row .nm{grid-column:1/-1;display:flex;gap:8px}
.team-row .nm input{flex:1;min-width:0}
.team-row .hrs{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.team-row input{background:var(--surface)}

.pgroup{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--sunk);scroll-margin-top:calc(90px + env(safe-area-inset-top,0px))}
.pgroup.need{border-color:var(--warn)}
.pg-h{display:flex;gap:8px;align-items:baseline;font-weight:600}
.pg-h span:first-child{flex:1;min-width:0}
.pg-h .cnt{font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap}
.pg-h .cnt.zero{color:var(--warn)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.thumbs:empty{display:none}
.th{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.th .im{position:relative;aspect-ratio:4/3;background:#000;max-width:100%}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .del{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:99px;border:0;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.th .del svg{width:16px;height:16px}
.th input{border:0;border-top:1px solid var(--line);border-radius:0;min-height:40px;font-size:14px;background:var(--surface)}
.pg-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* barra inferior */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bar .wrap{display:flex;gap:10px;padding-block:10px}
.bar .btn{flex:1}
.bar .status{font-size:12px;color:var(--muted);align-self:center;white-space:nowrap}

/* modal */
.modal{position:fixed;inset:0;z-index:40;background:rgba(8,12,14,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88%;overflow:auto;border-radius:14px 14px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
@media (min-width:600px){.modal{align-items:center}.sheet{border-radius:14px}}
.sheet h3{margin:0;font-family:var(--display);font-size:22px;text-transform:uppercase;letter-spacing:.02em}
.sheet p{margin:0;color:var(--muted)}
.sheet .acts{display:flex;gap:8px;flex-wrap:wrap}
.sheet .acts .btn{flex:1 1 140px}
.misslist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;max-height:46vh;overflow:auto}
.misslist li button{width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 12px;font-size:14.5px;display:flex;gap:8px}
.misslist li:first-child button{border-top:0}
.misslist small{color:var(--muted);margin-left:auto;white-space:nowrap}
.pdfdone{display:flex;gap:12px;align-items:center;padding:12px;border-radius:8px;background:var(--sunk);border:1px solid var(--line)}
.pdfdone svg{width:34px;height:34px;color:var(--accent);flex:none}
.pdfdone b{display:block;word-break:break-all;font-size:14px}
.pdfdone span{font-size:13px;color:var(--muted)}
.logo-slot{display:flex;gap:10px;align-items:center}
.logo-slot .pv{width:110px;height:44px;border:1px dashed var(--line);border-radius:6px;display:grid;place-items:center;background:#fff;overflow:hidden;font-size:11px;color:#7a858c}
.logo-slot .pv img{max-width:100%;max-height:100%}
.switch{display:flex;gap:10px;align-items:center;font-weight:500}
.switch input{width:22px;height:22px;accent-color:var(--accent)}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
/* capa de abertura: sempre escura, nos dois temas */
.splash{position:fixed;inset:0;z-index:70;background:#15202B;color:#F2F5F4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:calc(24px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));text-align:center;transition:opacity .35s ease;cursor:pointer}
.splash.out{opacity:0;pointer-events:none}
.splash svg{width:96px;height:96px}
.splash h1{margin:0;font-family:var(--display);font-weight:700;font-size:40px;line-height:1;letter-spacing:.02em;text-transform:uppercase}
.splash p{margin:0;font-size:15px;color:#AEBAC0;letter-spacing:.04em}
.splash .load{width:120px;height:3px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:8px}
.splash .load i{display:block;height:100%;width:0;background:#E8762A;animation:ld 2s ease forwards}
@keyframes ld{to{width:100%}}
.splash .dev{position:absolute;left:0;right:0;bottom:calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:2px;font-size:12.5px;color:#93A1A8;letter-spacing:.08em;text-transform:uppercase}
.splash .dev b{font-family:var(--display);font-size:20px;color:#F2F5F4;letter-spacing:.04em}
.priv{margin:0;display:flex;flex-direction:column;gap:10px;font-size:14.5px}
.priv dt{font-weight:700;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.priv dd{margin:2px 0 0}
.priv-meta{font-size:12.5px}
.privbox{border-top:1px solid var(--line);padding-top:14px;margin-top:4px;display:flex;flex-direction:column;gap:8px}
.privbox span{font-size:14px;color:var(--muted)}
.credit{margin:28px 0 8px;text-align:center;font-size:12.5px;color:var(--muted);letter-spacing:.04em}
.credit b{color:var(--ink);font-weight:600}
.ver-link{background:none;border:0;padding:0;font:inherit;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
/* aviso de novidades da versão */
.news-h{display:flex;align-items:center;gap:8px}
.news-tag{background:var(--accent);color:var(--accent-ink);font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:4px}
.news-ver{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.news{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.news li{display:flex;gap:12px;align-items:flex-start}
.news .ic{width:26px;height:26px;border-radius:50%;background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok);display:grid;place-items:center;flex:none;margin-top:1px}
.news .ic svg{width:15px;height:15px}
.news li>span:last-child{display:flex;flex-direction:column;gap:2px;min-width:0}
.news b{font-size:15.5px}
.news li span span{font-size:14px;color:var(--muted)}
/* versão de teste: selo amarelo para não confundir com o app oficial */
.badge-teste{display:inline-block;background:#F5BE1E;color:#15202B;font-family:var(--body);font-size:11px;font-weight:800;letter-spacing:.08em;padding:2px 6px;border-radius:4px;margin-left:8px;vertical-align:4px}
.splash .teste-tag{color:#F5BE1E;font-weight:700;letter-spacing:.14em;font-size:13px}
.busy{position:fixed;inset:0;z-index:60;background:rgba(8,12,14,.6);display:grid;place-items:center;color:#fff;font-weight:600}
.busy div{display:flex;flex-direction:column;align-items:center;gap:12px}
.spin{width:36px;height:36px;border-radius:50%;border:4px solid rgba(255,255,255,.25);border-top-color:#fff;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:2s!important}}
</style>

<header class="top">
  <div class="wrap" id="topbar"></div>
  <div class="prog" id="prog" hidden><i></i></div>
</header>
<main id="view"></main>
<div class="bar" id="bar" hidden>
  <div class="wrap">
    <span class="status" id="saveState">Salvo</span>
    <button class="btn pri" id="finish" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 15l2 2 4-4"/></svg>
      Finalizar e gerar PDF
    </button>
  </div>
</div>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="splash" id="splash" role="button" tabindex="0" aria-label="Abrir os relatórios">
  <svg viewBox="0 0 96 96" aria-hidden="true"><rect x="20" y="14" width="56" height="74" rx="4" fill="#D9640A"/><rect x="26" y="22" width="44" height="60" rx="2" fill="#F2F5F4"/><rect x="36" y="9" width="24" height="11" rx="3" fill="#15202B" stroke="#D9640A" stroke-width="3"/><path d="M35 52l9 9 17-20" fill="none" stroke="#1D8549" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <h1>Relatórios<br>GPBR - VALE</h1>

/* ============ armazenamento local criptografado ============
   Relatórios e ajustes ficam no IndexedDB cifrados com AES-GCM 256. A chave é gerada
   no próprio aparelho, não pode ser exportada e fica guardada só no IndexedDB do app. */
// o app de teste usa outro banco: os dois ficam no mesmo endereço (emersonrc26.github.io) e não podem misturar dados
const DB_NAME = (window.APP_CONFIG && window.APP_CONFIG.db) || "checklist-campo";
const mem = new Map(), memKv = new Map();   // usados quando o navegador não oferece IndexedDB
let idb = null;
const idbReady = new Promise(res => {
  try {
    const rq = indexedDB.open(DB_NAME, 2);
    rq.onupgradeneeded = () => { const d = rq.result;
      if(!d.objectStoreNames.contains("reports")) d.createObjectStore("reports", {keyPath:"id"});
      if(!d.objectStoreNames.contains("kv")) d.createObjectStore("kv"); };
    rq.onsuccess = () => { idb = rq.result; res(); };
    rq.onerror = rq.onblocked = () => res();
  } catch(e){ res(); }
});
function tx(store, mode, fn, fallback){
  return idbReady.then(() => new Promise((res, rej) => {
    if(!idb) return res(fallback());
    try { const t = idb.transaction(store, mode); const r = fn(t.objectStore(store)); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); }
    catch(e){ res(fallback()); }
  }));
}
const kvGet = k => tx("kv", "readonly", st => st.get(k), () => memKv.get(k)).catch(() => memKv.get(k));
const kvSet = (k, v) => { memKv.set(k, v); return tx("kv", "readwrite", st => st.put(v, k), () => {}).catch(() => {}); };

const IS_TESTE = !!(window.APP_CONFIG && window.APP_CONFIG.variant === "teste");

const CRYPTO_OK = !!(window.isSecureContext && window.crypto && crypto.subtle);
let KEY = null;
const keyReady = idbReady.then(async () => {
  if(!CRYPTO_OK) return;
  try {
    KEY = await kvGet("key");
    if(!KEY){ KEY = await crypto.subtle.generateKey({name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]); await kvSet("key", KEY); }
  } catch(e){ KEY = null; }
});
async function seal(obj){
  await keyReady;
  if(!KEY) return {plain:obj};
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const data = await crypto.subtle.encrypt({name:"AES-GCM", iv}, KEY, new TextEncoder().encode(JSON.stringify(obj)));
  return {iv, data};
}
async function unseal(box){
  await keyReady;
  if(!box) return null;
  if("plain" in box) return box.plain;
  if(!KEY) throw new Error("Chave de criptografia indisponível");
  const buf = await crypto.subtle.decrypt({name:"AES-GCM", iv:box.iv}, KEY, box.data);
  return JSON.parse(new TextDecoder().decode(buf));
}

/* cada relatório guarda um resumo (para a lista) e o conteúdo completo, os dois cifrados */
const metaOf = r => { const a = audit(r); return {templateId:r.templateId, status:r.status, om:r.header.om, tag:r.header.tag, updatedAt:r.updatedAt, pct:a.total ? Math.round(a.done/a.total*100) : 0}; };
let saveChain = Promise.resolve();
function dbPut(r){
  saveChain = saveChain.then(async () => {
    const rec = {id:r.id, updatedAt:r.updatedAt, meta:await seal(metaOf(r)), body:await seal(r)};
    mem.set(r.id, rec);
    await tx("reports", "readwrite", st => st.put(rec), () => {});
  }).catch(() => {});
  return saveChain;
}
async function dbList(){
  const recs = (await tx("reports", "readonly", st => st.getAll(), () => [...mem.values()]).catch(() => [...mem.values()])) || [];
  const out = [];
  for(const rec of recs){
    try {
      if(!rec.body){ await dbPut(rec); out.push({id:rec.id, ...metaOf(rec)}); continue; }   // relatório antigo sem criptografia: cifra agora
      out.push({id:rec.id, ...(await unseal(rec.meta))});
    } catch(e){ out.push({id:rec.id, broken:true, updatedAt:rec.updatedAt||0}); }
  }
  return out.sort((a, b) => b.updatedAt - a.updatedAt);
}
async function dbGet(id){
  const rec = await tx("reports", "readonly", st => st.get(id), () => mem.get(id)).catch(() => mem.get(id));
  if(!rec) return null;
  return rec.body ? unseal(rec.body) : rec;
}
const dbDel = id => { mem.delete(id); return tx("reports", "readwrite", st => st.delete(id), () => {}).catch(() => {}); };
async function wipeAll(){
  try { if(idb) idb.close(); } catch(e){}
  await new Promise(res => { try { const rq = indexedDB.deleteDatabase(DB_NAME); rq.onsuccess = rq.onerror = rq.onblocked = () => res(); } catch(e){ res(); } });
  try { localStorage.removeItem(SKEY); } catch(e){}
  mem.clear(); memKv.clear();
  location.reload();
}

function getPath(o, p){ return p.split(".").reduce((a,k) => a == null ? a : a[k], o); }
function setPath(o, p, v){ const ks = p.split("."); let a = o; ks.slice(0,-1).forEach(k => { if(a[k] == null) a[k] = {}; a = a[k]; }); a[ks[ks.length-1]] = v; }

/* ============ progresso / pendências ============ */
function audit(r){
  const T = tplById(r.templateId), miss = []; let total = 0, done = 0;
  const chk = (ok, label, anchor) => { total++; if(ok) done++; else miss.push({label, anchor}); };
  const h = r.header;
  chk(h.resp, "Responsável técnico", "f-resp"); chk(h.om, "Número da OM", "f-om"); chk(h.local, "Localidade", "f-local");
  chk(h.data, "Data de execução", "f-data"); chk(h.tag, "TAG do radar", "f-tag"); chk(h.modelo, "Modelo do radar", "f-modelo");
  chk(r.team.some(m => m.nome && m.inicio && m.fim), "Equipe: nome e horários", "sec-team");
  T.sections.forEach((s, si) => {
    if(s.type==="checklist"){
      s.items.forEach((it, ii) => { const k="s"+si+"i"+ii; chk(r.answers[k]?.status, s.title+": "+norm(it).t, "it-"+k); });
      (r.extra["s"+si]||[]).forEach(x => chk(r.answers[x.k]?.status && x.t, s.title+": item adicional", "it-"+x.k));
      s.photos.forEach((g, gi) => { const k="s"+si+"g"+gi; chk((r.photos[k]||[]).length, "Foto: "+g, "pg-"+k); });
    }
    if(s.type==="photos" && !s.optional) s.groups.forEach((g, gi) => { const k="s"+si+"g"+gi; chk((r.photos[k]||[]).length, s.title+": ao menos 1 foto", "pg-"+k); });
    if(s.type==="fields") s.fields.filter(f=>f.req).forEach(f => chk((r.texts[f.id]||"").trim(), s.title+": "+f.label, "f-"+f.id));
    if(s.type==="chips" && s.req) chk(r.chips.length, "Classe de falha", "sec-"+si);
    if(s.type==="final"){ chk(r.final.omFin, "OM finalizada?", "fin-omFin"); chk(r.final.cond, "Condição geral do radar", "fin-cond"); chk(r.final.manut, "Manutenção adicional?", "fin-manut"); chk(r.final.pend, "Há pendência?", "fin-pend"); }
  });
  return {total, done, miss};
}
function updateProgress(){
  if(!R) return;
  const a = audit(R); const pct = a.total ? Math.round(a.done/a.total*100) : 0;
  $("#prog i").style.width = pct+"%";
  const c = $("#pct"); if(c) c.textContent = pct+"% preenchido";
}

/* ============ eventos ============ */
let photoTarget = null;
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act],[data-seg],[data-chip]"); if(!b) return;
  if(b.dataset.seg){
    const path = b.dataset.seg, v = b.dataset.v, cur = getPath(R, path);
    setPath(R, path, cur === v ? "" : v);
    b.parentElement.querySelectorAll("button").forEach(x => { const on = x.dataset.v === getPath(R, path); x.classList.toggle("on", on); x.setAttribute("aria-checked", on); });
    const m = path.match(/^answers\.(\w+)\.status$/);
    if(m){ const it = document.getElementById("it-"+m[1]); const obs = it && it.querySelector(".obs"); const st = getPath(R, path); const need = st==="Reparar"||st==="Substituir";
      if(obs){ obs.placeholder = need ? "Descreva o problema encontrado" : "Observação (opcional)"; obs.classList.toggle("need", need && !obs.value); if(need) obs.focus({preventScroll:true}); } }
    touch(); return;
  }
  if(b.dataset.chip){
    const o = b.dataset.chip, i = R.chips.indexOf(o);
    if(i>=0) R.chips.splice(i,1); else R.chips.push(o);
    b.classList.toggle("on", i<0); b.setAttribute("aria-pressed", i<0);
    $("#outroWrap").hidden = !R.chips.includes("Outros"); touch(); return;
  }
  const act = b.dataset.act;
  if(act==="new"){ R = newReport(b.dataset.tid); await dbPut(R); renderForm(); navOpen("form"); }
  else if(act==="open"){ let r = null; try { r = await dbGet(b.dataset.id); } catch(e){} if(r){ R = r; renderForm(); navOpen("form"); } else toast("Não foi possível abrir este relatório"); }
  else if(act==="del"){ if(await confirmSheet("Excluir relatório?", "O rascunho e as fotos dele serão apagados deste aparelho.", "Excluir")){ await dbDel(b.dataset.id); renderHome(); toast("Relatório excluído"); } }
  else if(act==="home") goHome();
  else if(act==="settings") openSettings();
  else if(act==="news") openNews(false);
  else if(act==="install" && installEvt){ installEvt.prompt(); try { await installEvt.userChoice; } catch(e){} installEvt = null; renderHome(); }
  else if(act==="addm"){ R.team.push({nome:"", empresa:settings.empresa||"GPBR", inicio:"", fim:""}); $("#team").innerHTML = teamHTML(); touch(); }
  else if(act==="delm"){ R.team.splice(+b.dataset.i,1); $("#team").innerHTML = teamHTML(); touch(); }
  else if(act==="addx"){ const si = b.dataset.s, k = "x"+uid(); (R.extra["s"+si] ||= []).push({k, t:""}); renderKeepScroll(); const inp = document.querySelector(`#it-${k} input`); if(inp) inp.focus(); touch(); }
  else if(act==="delx"){ const k = b.dataset.k; Object.keys(R.extra).forEach(s => R.extra[s] = R.extra[s].filter(x => x.k!==k)); delete R.answers[k]; renderKeepScroll(); touch(); }
  else if(act==="cam" || act==="gal"){ photoTarget = b.dataset.g; const inp = $(act==="cam" ? "#camIn" : "#galIn"); inp.value = ""; inp.click(); }
  else if(act==="delph"){ if(await confirmSheet("Excluir esta foto?", "Ela será removida do relatório.", "Excluir")){ const g = b.dataset.g; R.photos[g] = (R.photos[g]||[]).filter(p => p.id!==b.dataset.p); refreshGroup(g); touch(); } }
});
function renderKeepScroll(){ const y = window.scrollY; renderForm(); window.scrollTo(0, y); }
document.addEventListener("input", e => {
  const t = e.target;
  if(t.dataset.bind && R){
    const p = t.dataset.bind;
    if(p.startsWith("xlabel.")){ const k = p.slice(7); Object.values(R.extra).forEach(arr => arr.forEach(x => { if(x.k===k) x.t = t.value; })); }
    else setPath(R, p, t.value);
    if(t.classList.contains("obs")) t.classList.toggle("need", t.classList.contains("need") && !t.value);
    touch();
  }
  if(t.dataset.cap && R){ const [g, id] = t.dataset.cap.split("|"); const p = (R.photos[g]||[]).find(x => x.id===id); if(p){ p.caption = t.value; touch(); } }
});
document.addEventListener("change", e => {
  const t = e.target;
  if(t.dataset.chk && R){ setPath(R, t.dataset.chk, t.checked); touch(); }
  if(t.id==="jump" && t.value){ document.getElementById(t.value)?.scrollIntoView({behavior:"smooth", block:"start"}); t.value = ""; }

["#camIn","#galIn"].forEach(sel => $(sel).addEventListener("change", async e => {

  const g = photoTarget; busy(true, files.length>1 ? `Processando ${files.length} fotos…` : "Processando foto…");
  try {
    for(const f of files){
      const stamp = settings.stamp ? fmtDT(f.lastModified || Date.now()) + (R.header.tag ? " · "+R.header.tag : "") : "";
      const img = await processImage(f, 1600, stamp);

}));

/* ============ imagem: redimensiona, corrige orientação e carimba data ============ */
function loadImg(file){ return new Promise((res, rej) => { const u = URL.createObjectURL(file); const i = new Image(); i.onload = () => { res(i); }; i.onerror = rej; i.src = u; }); }
async function processImage(file, max, stamp, png){
  let src; try { src = await createImageBitmap(file, {imageOrientation:"from-image"}); } catch(e){ src = await loadImg(file); }
  const sw = src.width || src.naturalWidth, sh = src.height || src.naturalHeight;
  const s = Math.min(1, max / Math.max(sw, sh)); const w = Math.round(sw*s), h = Math.round(sh*s);
  const c = document.createElement("canvas"); c.width = w; c.height = h; const x = c.getContext("2d");
  if(!png){ x.fillStyle = "#fff"; x.fillRect(0,0,w,h); }
  x.drawImage(src, 0, 0, w, h);
  if(stamp){
    const fs = Math.max(14, Math.round(Math.min(w,h)*0.034)), pad = Math.round(fs*0.45);
    x.font = `600 ${fs}px Barlow, Arial, sans-serif`; const tw = x.measureText(stamp).width;
    x.fillStyle = "rgba(0,0,0,.6)"; x.fillRect(w - tw - pad*3, h - fs - pad*3, tw + pad*2, fs + pad*2);
    x.fillStyle = "#fff"; x.textBaseline = "top"; x.fillText(stamp, w - tw - pad*2, h - fs - pad*2.1);
  }
  return {data: c.toDataURL(png ? "image/png" : "image/jpeg", 0.8), w, h};
}

/* ============ folhas (modais) ============ */
let sheetLocked = false;   // o aviso de privacidade do primeiro uso só fecha pelo botão

/* ============ botão "voltar" do celular ============
   Cada tela ou janela aberta (relatório, folha, painel lateral) ganha um passo no histórico do navegador.
   Assim o voltar do Android fecha o que está aberto, ou volta ao início, em vez de fechar o app. */
const navLayers = [];   // camadas abertas, da mais antiga para a mais recente
let navSkip = 0, navDeferred = 0, navTimer = null;
function navOpen(layer){
  if(navLayers.includes(layer)) return;
  navLayers.push(layer);
  // uma camada que acabou de fechar pelo app ainda não devolveu o passo: reaproveita em vez de criar outro
  if(navDeferred > 0){ navDeferred--; if(!navDeferred){ clearTimeout(navTimer); navTimer = null; } return; }
  history.pushState({layer}, "");
}
function navClose(layer){   // camada fechada por um botão do app: tira o passo dela do histórico
  const i = navLayers.lastIndexOf(layer); if(i < 0) return;
  navLayers.splice(i, 1);
  navDeferred++; clearTimeout(navTimer);
  navTimer = setTimeout(() => { const n = navDeferred; navDeferred = 0; navTimer = null; if(n){ navSkip++; history.go(-n); } }, 60);
}
window.addEventListener("popstate", () => {
  if(navSkip > 0){ navSkip--; return; }   // foi o próprio app voltando o histórico
  const layer = navLayers.pop(); if(!layer) return;
  if(layer === "sheet"){
    if(sheetLocked){ navLayers.push("sheet"); history.pushState({layer:"sheet"}, ""); return; }
    closeSheet(true);
  }
  else if(layer === "drawer" && typeof closeDrawer === "function") closeDrawer(true);
  else if(layer === "form") goHome(true);
});
async function goHome(fromBack){
  if(fromBack !== true) navClose("form");
  clearTimeout(saveTimer); if(R) await dbPut(R);
  if(window.__reloadOnHome) return location.reload();
  renderHome(); window.scrollTo(0,0);
}
function openSheet(html){ navOpen("sheet"); $("#sheet").innerHTML = html; $("#sheet").onclick = null; $("#modal").hidden = false; $("#sheet").scrollTop = 0; }
function closeSheet(fromBack){ if(fromBack !== true) navClose("sheet"); sheetLocked = false; $("#modal").hidden = true; $("#sheet").innerHTML = ""; }
$("#modal").addEventListener("click", e => { if(e.target.id==="modal" && !sheetLocked) closeSheet(); });
document.addEventListener("keydown", e => { if(e.key==="Escape" && !$("#modal").hidden && !sheetLocked) closeSheet(); });

/* ============ novidades da versão ============
   Depois de cada atualização, mostra uma vez um resumo curto do que mudou (lista em window.APP_NEWS,
   gerada por build-pwa.ps1 a partir de novidades.json). Quem acabou de instalar não vê: não há o que comparar. */
const NEWS = Array.isArray(window.APP_NEWS) ? window.APP_NEWS : [];
async function checkNews(){
  const v = window.APP_VERSION; if(!v) return;
  if((await kvGet("newsSeen")) === v) return;
  if(!NEWS.length){ await kvSet("newsSeen", v); return; }
  openNews(true);
}
function openNews(firstTime){
  if(!NEWS.length){ toast("Nenhuma novidade registrada para esta versão"); return; }
  const check = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  openSheet(`<div class="news-h"><span class="news-tag">Novidades</span><span class="news-ver">${esc(window.APP_VERSION || "")}${IS_TESTE ? " · teste" : ""}</span></div>

    <ul class="news">${NEWS.map(n => `<li><span class="ic" aria-hidden="true">${check}</span><span><b>${esc(n.t)}</b>${n.d ? `<span>${esc(n.d)}</span>` : ""}</span></li>`).join("")}</ul>
    <div class="acts"><button class="btn pri" id="nwOk" type="button">Entendi</button></div>`);
  $("#nwOk").onclick = closeSheet;

}
function confirmSheet(title, text, okLabel){
  return new Promise(res => {
    openSheet(`<h3>${esc(title)}</h3><p>${esc(text)}</p><div class="acts"><button class="btn" id="cNo" type="button">Cancelar</button><button class="btn pri" id="cOk" type="button">${esc(okLabel)}</button></div>`);
    $("#cNo").onclick = () => { closeSheet(); res(false); }; $("#cOk").onclick = () => { closeSheet(); res(true); };

}

let lastPdf = null;
async function makePdf(){
  if(!window.jspdf || !window.jspdf.jsPDF){ toast("O gerador de PDF não carregou. Verifique a internet e recarregue."); return; }
  busy(true, "Gerando PDF…");
  await new Promise(r => setTimeout(r, 30));
  try {
    const {blob, pages, filename} = buildPdf(R);
    lastPdf = {blob, filename};
    R.status = "finalizado"; touch();
    const mb = (blob.size/1048576).toFixed(1).replace(".", ",");
    const canShare = !inClaude && navigator.canShare && navigator.canShare({files:[new File([blob], filename, {type:"application/pdf"})]});
    const dl = await dlPromise;
    openSheet(`<h3>PDF pronto</h3>
      <div class="pdfdone">${ICON.pdf}<div><b>${esc(filename)}</b><span>${pages} ${pages>1?"páginas":"página"} · ${mb} MB</span></div></div>
      <div class="acts">
        ${canShare ? `<button class="btn pri" id="pShare" type="button">Compartilhar</button>` : ""}
        ${dl || !inClaude ? `<button class="btn${canShare?"":" pri"}" id="pSave" type="button">Salvar PDF</button>` : ""}
        ${!inClaude ? `<button class="btn" id="pOpen" type="button">Visualizar</button>` : ""}
      </div>
      ${inClaude && !dl ? `<p>O download não está disponível nesta visualização. Abra o app pelo navegador do celular para salvar o PDF.</p>` : ""}
      <button class="btn ghost" id="pClose" type="button">Voltar ao relatório</button>`);
    $("#pClose").onclick = closeSheet;
    const s = $("#pSave"); if(s) s.onclick = () => savePdf(dl);
    const sh = $("#pShare"); if(sh) sh.onclick = async () => { try { await navigator.share({files:[new File([blob], filename, {type:"application/pdf"})], title:filename}); } catch(e){} };
    const o = $("#pOpen"); if(o) o.onclick = () => { const u = URL.createObjectURL(blob); const a = document.createElement("a"); a.href = u; a.target = "_blank"; a.rel = "noopener"; a.click(); };
  } catch(err){ console.error(err); toast("Erro ao gerar o PDF: "+(err.message||err)); }
  busy(false);
}
async function savePdf(dl){
  const {blob, filename} = lastPdf;
  if(dl){
    try { await dl.save({filename, data:blob}); toast("PDF salvo"); }
    catch(e){ toast(e && e.code==="declined" ? "Download cancelado" : "Não foi possível salvar o PDF aqui"); }
    return;
  }
  const u = URL.createObjectURL(blob); const a = document.createElement("a"); a.href = u; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 20000); toast("PDF salvo em Downloads");
}

/* ============ PDF ============ */
function buildPdf(r){
  const T = tplById(r.templateId), h = r.header;
  const doc = new window.jspdf.jsPDF({unit:"mm", format:"a4", compress:true});
  const W = 210, H = 297, M = 14, CW = W - 2*M, TOP = 33, BOTTOM = H - 26;
  const INK = [21,32,43], MUT = [96,108,116], LINE = [200,208,206], SOFT = [242,244,243], ACC = [217,100,10];
  const TONES = {ok:[29,133,73], warn:[184,125,0], bad:[191,51,40], na:[111,123,130]};
  let y = TOP, secN = 0, itemN = 0;
  const ensure = need => { if(y + need > BOTTOM){ doc.addPage(); y = TOP; } };
  const base = {margin:{left:M, right:M, top:TOP, bottom:H-BOTTOM}, theme:"grid", rowPageBreak:"avoid",
    styles:{font:"helvetica", fontSize:8.6, cellPadding:{top:1.8,bottom:1.8,left:2,right:2}, lineColor:LINE, lineWidth:0.2, textColor:INK, valign:"middle", overflow:"linebreak"},
    headStyles:{fillColor:INK, textColor:255, fontStyle:"bold", fontSize:7.8, halign:"left"}};
  const table = o => { doc.autoTable({...base, ...o, startY:y, styles:{...base.styles, ...(o.styles||{})}, headStyles:{...base.headStyles, ...(o.headStyles||{})}}); y = doc.lastAutoTable.finalY + 6; };
  const LAB = {fillColor:SOFT, fontStyle:"bold", textColor:MUT, fontSize:7.6};
  const heading = title => {
    ensure(22); secN++;
    doc.setFillColor(...INK); doc.rect(M, y, CW, 7.5, "F");
    doc.setFillColor(...ACC); doc.rect(M, y, 9, 7.5, "F");
    doc.setFont("helvetica","bold"); doc.setFontSize(9.5); doc.setTextColor(255,255,255);
    doc.text(String(secN), M+4.5, y+5.2, {align:"center"});
    doc.text(title.toUpperCase(), M+12, y+5.2);
    y += 10.5;
  };
  const sub = title => { doc.setFont("helvetica","bold"); doc.setFontSize(9); doc.setTextColor(...INK); doc.text(title, M, y+3.5); doc.setDrawColor(...ACC); doc.setLineWidth(0.5); doc.line(M, y+5.2, M+12, y+5.2); y += 8; };
  const toneCell = (d, colStart) => { if(d.section==="body" && d.column.index>=colStart && d.cell.raw && typeof d.cell.raw === "object" && d.cell.raw.tone){ d.cell.styles.fillColor = TONES[d.cell.raw.tone]; d.cell.styles.textColor = 255; } };
  const mark = (on, tone) => on ? {content:"X", tone} : "";

  /* fotos em grade 2 colunas */
  const photos = (title, list) => {
    if(!list || !list.length) return;
    const gap = 6, cw = (CW - gap)/2, ih = 64;
    let first = true;
    for(let i = 0; i < list.length; i += 2){
      const row = list.slice(i, i+2);
      const capLines = row.map(p => p.caption ? doc.setFontSize(8).splitTextToSize(p.caption, cw - 2).slice(0,3) : []);
      const capH = Math.max(...capLines.map(l => l.length)) * 3.6 + 3;
      ensure((first ? 8 : 0) + ih + capH + 2);
      if(first){ if(title) sub(title); first = false; }
      row.forEach((p, j) => {
        const x = M + j*(cw + gap);
        doc.setFillColor(...SOFT); doc.setDrawColor(...LINE); doc.setLineWidth(0.2); doc.rect(x, y, cw, ih, "FD");
        const s = Math.min(cw / p.w, ih / p.h), w = p.w*s, hh = p.h*s;
        doc.addImage(p.data, "JPEG", x + (cw - w)/2, y + (ih - hh)/2, w, hh, undefined, "FAST");
        if(capLines[j].length){ doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(...INK); doc.text(capLines[j], x + 1, y + ih + 3.8); }
      });
      y += ih + capH + 2;
    }
    y += 3;
  };

  /* identificação */
  table({ body:[
      [{content:"Responsável técnico", styles:LAB}, {content:h.resp||"", colSpan:3, styles:{fontStyle:"bold"}}],
      [{content:"OM", styles:LAB}, h.om||"", {content:"Data de execução", styles:LAB}, fmtDate(h.data)],
      [{content:"Localidade", styles:LAB}, h.local||"", {content:"TAG do radar", styles:LAB}, h.tag||""],
      [{content:"Modelo", styles:LAB}, h.modelo||"", {content:"Tipo de atividade", styles:LAB}, T.kind==="Preventiva" ? "Manutenção preventiva (MTM)" : T.kind==="Inspeção" ? "Inspeção" : "Manutenção corretiva"],
    ], columnStyles:{0:{cellWidth:32}, 1:{cellWidth:59}, 2:{cellWidth:32}} });

  heading("Equipe de atendimento à demanda");
  table({ head:[["Executante","Empresa","Horário de início","Horário de fim"]], body:(r.team.filter(m => m.nome || m.inicio).map(m => [m.nome, m.empresa, m.inicio, m.fim]).concat([["","","",""]])).slice(0, Math.max(1, r.team.filter(m => m.nome || m.inicio).length)),
    columnStyles:{1:{cellWidth:32}, 2:{cellWidth:32, halign:"center"}, 3:{cellWidth:32, halign:"center"}} });

  T.sections.forEach((s, si) => {
    if(s.type==="checklist"){
      const rows = s.items.map(norm).map((it, ii) => ({k:"s"+si+"i"+ii, t:it.t, unit:it.unit}))
        .concat((r.extra["s"+si]||[]).filter(x => x.t || r.answers[x.k]?.status).map(x => ({k:x.k, t:x.t||"Item adicional"})));
      const hasPhotos = s.photos.some((g, gi) => (r.photos["s"+si+"g"+gi]||[]).length);
      heading(s.title);
      table({ head:[["Sn","Item de inspeção","Observação","Bom","Reparar","Substituir","N/D"]],
        body: rows.map(x => { const a = r.answers[x.k] || {}; const read = x.unit && a.val ? `Leitura: ${a.val} ${x.unit}` : "";
          return [++itemN, x.t, [read, a.obs].filter(Boolean).join("\n"), ...ST4.map(o => mark(a.status===o, TONE[o]))]; }),
        headStyles:{halign:"center"},
        columnStyles:{0:{cellWidth:9, halign:"center", textColor:MUT}, 1:{cellWidth:64}, 3:{cellWidth:13.5, halign:"center", fontStyle:"bold"}, 4:{cellWidth:14.5, halign:"center", fontStyle:"bold"}, 5:{cellWidth:16.5, halign:"center", fontStyle:"bold"}, 6:{cellWidth:12, halign:"center", fontStyle:"bold"}},
        didParseCell: d => { if(d.section==="head" && d.column.index<3) d.cell.styles.halign = "left"; toneCell(d, 3); } });
      if(hasPhotos){ s.photos.forEach((g, gi) => photos(g, r.photos["s"+si+"g"+gi])); }
    }
    if(s.type==="activities"){
      heading(s.title);
      doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(...INK); doc.text(s.intro, M, y+2); y += 5;
      table({ head:[["#","Atividade","Leitura","Realizada"]],
        body: s.items.map(norm).map((it, ii) => { const a = r.acts["s"+si+"i"+ii] || {}; return [ii+1, it.t, it.unit && a.val ? a.val+" "+it.unit : (it.unit ? "—" : ""), a.done ? {content:"Sim", tone:"ok"} : {content:"Não", tone:"bad"}]; }),
        columnStyles:{0:{cellWidth:9, halign:"center", textColor:MUT}, 2:{cellWidth:24, halign:"center"}, 3:{cellWidth:20, halign:"center", fontStyle:"bold"}},
        didParseCell: d => toneCell(d, 3) });
    }
    if(s.type==="fields"){
      heading(s.title);
      table({ body: s.fields.map(f => [{content:f.label, styles:LAB}, r.texts[f.id] || ""]), columnStyles:{0:{cellWidth:42}}, styles:{fontSize:9, valign:"top", minCellHeight:9} });
    }
    if(s.type==="chips"){
      heading(s.title);
      const cells = s.options.map(o => { const on = r.chips.includes(o); const txt = (on ? "[X]  " : "[   ]  ") + o.toUpperCase() + (o==="Outros" && on && r.chipOutro ? ": "+r.chipOutro : ""); return {content:txt, on}; });
      const body = []; for(let i = 0; i < cells.length; i += 3) body.push(cells.slice(i, i+3).concat(Array(3).fill("")).slice(0,3));
      table({ body, theme:"plain", styles:{fontSize:8.6, cellPadding:1.6},
        didParseCell: d => { if(d.cell.raw && d.cell.raw.on){ d.cell.styles.fontStyle = "bold"; d.cell.styles.textColor = ACC; } } });
    }
    if(s.type==="photos"){
      const groups = s.groups.map((g, gi) => [g, r.photos["s"+si+"g"+gi] || []]);
      if(s.optional && !groups.some(([, l]) => l.length)) return;
      heading(s.title);
      groups.forEach(([g, l]) => { if(l.length) photos(s.free && s.groups.length===1 ? "" : g, l); else { doc.setFont("helvetica","italic"); doc.setFontSize(8.5); doc.setTextColor(...MUT); doc.text("Sem registro fotográfico.", M, y+3); y += 8; } });
    }
    if(s.type==="final"){
      const F = r.final;
      heading(s.title);
      table({ head:[["Item de inspeção","Observação","Sim","Não","N/D"]],
        body:[["OM finalizada", F.omFinObs||"", mark(F.omFin==="Sim","ok"), mark(F.omFin==="Não","bad"), mark(F.omFin==="N/D","na")]],
        columnStyles:{0:{cellWidth:64}, 2:{cellWidth:14, halign:"center", fontStyle:"bold"}, 3:{cellWidth:14, halign:"center", fontStyle:"bold"}, 4:{cellWidth:14, halign:"center", fontStyle:"bold"}},
        didParseCell: d => { if(d.section==="head" && d.column.index>=2) d.cell.styles.halign = "center"; toneCell(d, 2); } });
      const lt = (v, tones) => v ? {content:v, tone:(tones||TONE)[v]} : "";
      table({ head:[["Item de inspeção","Observação","Leitura"]],
        body:[["Condição geral do radar", F.condObs||"", lt(F.cond)], ["Necessária alguma manutenção adicional?", F.manutQual||"", lt(F.manut, YN_INV)], ["Há alguma pendência?", F.pendQual||"", lt(F.pend, YN_INV)]],
        columnStyles:{0:{cellWidth:64}, 2:{cellWidth:42, halign:"center", fontStyle:"bold"}},
        didParseCell: d => toneCell(d, 2) });
      table({ head:[["Nota adicional"]], body:[[F.nota || " "]], styles:{fontSize:9, valign:"top"}, bodyStyles:{minCellHeight:16} });
    }
  });

  /* cabeçalho e rodapé em todas as páginas */
  const n = doc.getNumberOfPages();
  // desenha um logo dentro da caixa (x, y, largura máx., altura), centralizado na vertical; devolve a largura usada
  const logo = (L, x, y, maxW, boxH) => { if(!L || maxW <= 0) return 0; const s = Math.min(maxW / L.w, boxH / L.h), w = L.w*s, hh = L.h*s;
    doc.addImage(L.data, L.data.startsWith("data:image/png") ? "PNG" : "JPEG", x, y + (boxH - hh)/2, w, hh); return w; };
  for(let i = 1; i <= n; i++){
    doc.setPage(i);
    const wl = logo(settings.logoL, M, 8, 42, 11), wr = 0;
    // rodapé: Orica Digital Solutions e, ao lado, a faixa de marcas
    const f1 = logo(settings.logoF1, M, H - 14.5, 32, 9.5);
    logo(settings.logoF2, M + f1 + (f1 ? 6 : 0), H - 14.5, CW - f1 - (f1 ? 6 : 0), 4.6);
    const cx = M + wl + (CW - wl - wr)/2;
    doc.setFont("helvetica","bold"); doc.setFontSize(wl || wr ? 10.5 : 12.5); doc.setTextColor(...INK);
    const tl = doc.splitTextToSize(T.title, CW - wl - wr - 6);
    doc.text(tl, cx, tl.length > 1 ? 12.5 : 14.5, {align:"center"});
    doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(...MUT);
    doc.text(`${T.name}  ·  OM ${h.om || "—"}  ·  ${fmtDate(h.data)}`, cx, tl.length > 1 ? 21.5 : 20.5, {align:"center"});
    doc.setDrawColor(...ACC); doc.setLineWidth(0.9); doc.line(M, 25, W - M, 25);
    doc.setDrawColor(...LINE); doc.setLineWidth(0.2); doc.line(M, H - 22, W - M, H - 22);
    doc.setFontSize(7.5); doc.setTextColor(...MUT);
    doc.text(`TAG ${h.tag || "—"}  ·  ${h.local || ""}  ·  Responsável: ${h.resp || "—"}`, M, H - 17.5);
    doc.text(`Página ${i} de ${n}`, W - M, H - 17.5, {align:"right"});
  }
  const clean = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^\w-]+/g,"_").replace(/^_+|_+$/g,"");
  const filename = [T.short, clean(h.tag)||"semTAG", h.om ? "OM"+clean(h.om) : "", (h.data||today()).replace(/-/g,"")].filter(Boolean).join("_") + ".pdf";
  return {blob: doc.output("blob"), pages: n, filename};
}

/* abertura: a capa fica na tela enquanto a chave e os ajustes carregam; depois, no primeiro uso, o aviso de privacidade */
(async function boot(){
  const sp = $("#splash"); let gone = false, ready = false;
  const hide = () => { if(gone || !ready) return; gone = true; sp.classList.add("out"); setTimeout(() => sp.hidden = true, 400); checkPrivacy(); };
  let timeUp = false;
  sp.addEventListener("click", hide);
  sp.addEventListener("keydown", e => { if(e.key === "Enter" || e.key === " ") hide(); });
  setTimeout(() => { timeUp = true; hide(); }, matchMedia("(prefers-reduced-motion: reduce)").matches ? 1200 : 2200);
  await keyReady; await loadSettings(); await renderHome();
  ready = true; if(timeUp) hide();
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  // Quando uma versão nova assume, recarrega na hora (na tela inicial) ou ao voltar para ela (no meio de um relatório)
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hadController || reloaded) return;
    if (!R) { reloaded = true; location.reload(); }
    else { window.__reloadOnHome = true; toast("Versão nova do app pronta. Ela abre quando você voltar para o início."); }
  });
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js", {updateViaCache: "none"}).then(reg => reg.update()).catch(() => {});
  });
}
</script>
